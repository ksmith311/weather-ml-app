name: CI pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/weather-ml-app:v1

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run smoke test
        run: python -m unittest tests/smoke_test.py -v

      - name: Run unit test
        run: python -m unittest tests/unit_test.py -v

      - name: Run integration test
        run: python -m unittest tests/integration_test.py -v

      - name: Build Docker image
        run: docker build -t $IMAGE .

      - name: Test container launches
        run: |
          docker run -d --name test-container -p 5000:5000 $IMAGE
          sleep 10
          docker exec test-container python --version
          docker ps
          docker rm -f test-container

      - name: Login to DockerHub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Push Docker image
        run: docker push $IMAGE
